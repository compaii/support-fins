name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deno-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify Bambu workflow preservation checks
        run: python3 -m unittest discover -s tools -p 'test_bambu_evaluate.py' -v
      - name: Run test suite
        run: deno test -A
